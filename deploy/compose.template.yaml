name: @@SERVICE@@
services:
  api:
    image: @@API_IMAGE@@
    restart: unless-stopped
    init: true
    user: "1000:1000"
    env_file:
      - path: @@PRIVATE_DIR@@/server.env
        format: raw
    environment:
      RELEASE: @@RELEASE@@
      TRUSTED_PROXY_IPS: @@PROXY_IP@@
      NODE_OPTIONS: --max-old-space-size=768
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1100m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    secrets: [supabase-ca.crt]
    volumes:
      - /etc/@@SERVICE@@/provider-check.mjs:/app/staging-provider-check.mjs:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      backend:
        ipv4_address: @@API_IP@@
  proxy:
    image: public.ecr.aws/docker/library/caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    volumes:
      - /etc/@@SERVICE@@/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: @@PROXY_IP@@
  cleanup:
    image: @@API_IMAGE@@
    profiles: [maintenance]
    user: "1000:1000"
    init: true
    env_file:
      - path: @@PRIVATE_DIR@@/server.env
        format: raw
    environment:
      RELEASE: @@RELEASE@@
    command: [node, dist/cleanup.js]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    secrets: [supabase-ca.crt]
    networks: [backend]
secrets:
  supabase-ca.crt:
    file: @@PRIVATE_DIR@@/supabase-ca.crt
networks:
  backend:
    ipam:
      config:
        - subnet: @@SUBNET@@
volumes:
  caddy_data:
  caddy_config:
