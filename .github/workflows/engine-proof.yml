name: Offline engine proof
on:
  push:
    branches: [feat/desktop-web-foundation]
    paths: ['engine/**', 'scripts/build-engine.mjs', '.github/workflows/engine-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - run: node engine/scripts/reference.mjs 2
      - run: node scripts/build-engine.mjs
      - run: node engine/scripts/conformance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: offline-engine
          path: public/engine/
          retention-days: 7
