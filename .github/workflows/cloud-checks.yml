name: Cloud API checks
on:
  push:
    branches: [feat/desktop-web-foundation]
    paths: ['server/**', 'src/core/**', 'src/storage/**', '.github/workflows/cloud-checks.yml']
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-fund
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: api-lockfile
          path: server/package-lock.json
