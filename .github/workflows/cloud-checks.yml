name: Cloud API checks
on:
  push:
    branches: [feat/desktop-web-foundation]
    paths: ['server/**', 'src/core/**', 'src/storage/**', '.github/workflows/cloud-checks.yml']
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccs_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ccs_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ccs_test -d ccs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ccs_test:ci-only-password@127.0.0.1:5432/ccs_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-fund
      - run: npm run build
      - run: npm test
      - run: docker build -f Dockerfile -t cubing-comp-sim-api:ci ..
      - uses: actions/upload-artifact@v4
        with:
          name: api-lockfile
          path: server/package-lock.json
