name: Deploy isolated staging frontend
on:
  push:
    branches: [deploy/isolated-staging]
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Successful Desktop web checks run supplying the verified engine
        required: true
        default: '38177898361'
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-staging-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CCS_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CCS_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the source evidence run passed
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_run_id || '38177898361' }}
        run: |
          node --input-type=module <<'NODE'
          if (!/^\d+$/.test(process.env.VERIFIED_RUN)) throw new Error('Invalid evidence run ID.');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.VERIFIED_RUN}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } });
          const run = await response.json();
          if (!response.ok || run.name !== 'Desktop web checks' || run.conclusion !== 'success') throw new Error('The verified web evidence run must have succeeded.');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web-evidence
          path: verified
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id || '38177898361' }}
      - run: npm ci --include=optional --no-fund
      - run: npm test
      - run: node --test deploy/auth-providers.test.mjs
      - run: node deploy/build-frontend.mjs deploy/environments/staging.json verified
      - run: npx --yes wrangler@4 deploy --config wrangler.release.json --dry-run
      - run: npx playwright install --with-deps chromium
      - run: node scripts/account-ui-check.mjs
      - run: node deploy/frontend-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: staging-frontend-${{ github.sha }}
          path: |
            dist/
            wrangler.release.json
            deploy/environments/staging.json
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: staging-frontend-${{ github.sha }}
          path: release
      - name: Deploy the tested staging frontend
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config release/wrangler.release.json

  activate:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Connect the existing staging hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/connect-domain.mjs deploy/environments/staging.json
