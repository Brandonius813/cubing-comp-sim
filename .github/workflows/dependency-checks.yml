name: Dependency security checks
# Runs weekly (and on demand) instead of on every change. The known advisories in
# upstream build tools made this fail on every pull request without telling us anything new.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'server', 'mobile']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm audit --json --audit-level=high
