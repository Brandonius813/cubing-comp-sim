name: Deploy production frontend
on:
  workflow_run:
    workflows: [Desktop web checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Successful main Desktop web checks run supplying the release source and verified engine
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: production-frontend-deployment
  cancel-in-progress: false
jobs:
  build:
    if: >-
      vars.CCS_PRODUCTION_SUPABASE_PUBLISHABLE_KEY != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.evidence.outputs.source_commit }}
    env:
      CCS_PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CCS_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
    steps:
      - name: Verify the release evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_run_id || github.event.workflow_run.id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          if (!/^\d+$/.test(process.env.VERIFIED_RUN)) throw new Error('Invalid evidence run ID.');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.VERIFIED_RUN}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } });
          const run = await response.json();
          if (!response.ok || run.name !== 'Desktop web checks' || run.conclusion !== 'success' || run.head_branch !== 'main' || !/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Use successful main web evidence.');
          const mainResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` }, cache: 'no-store' });
          const main = await mainResponse.json();
          if (!mainResponse.ok || main.object?.sha !== run.head_sha) throw new Error('This release has been superseded. Deploy successful evidence from current main.');
          appendFileSync(process.env.GITHUB_OUTPUT, `source_commit=${run.head_sha}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.evidence.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web-evidence
          path: verified
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id || github.event.workflow_run.id }}
      - name: Require the production API
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('deploy/environments/production.json', 'utf8'));
          if (config.environment !== 'production' || config.appUrl !== 'https://cubingcompsim.com' || config.apiUrl !== 'https://api.cubingcompsim.com') throw new Error('Production environment mismatch.');
          const response = await fetch(`${config.apiUrl}/health`, { signal: AbortSignal.timeout(15000) });
          if (!response.ok || (await response.json()).status !== 'ok') throw new Error('Production API is unavailable.');
          const unauthenticated = await fetch(`${config.apiUrl}/v1/save/metadata`, { signal: AbortSignal.timeout(15000) });
          if (unauthenticated.status !== 401) throw new Error('Production saves must require authentication.');
          NODE
      - run: npm ci --include=optional --no-fund
      - run: node deploy/build-frontend.mjs deploy/environments/production.json verified
      - run: npx --yes wrangler@4 deploy --config wrangler.release.json --dry-run
      - run: npx playwright install --with-deps chromium
      - run: node deploy/frontend-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-frontend-${{ steps.evidence.outputs.source_commit }}
          path: |
            dist/
            wrangler.release.json
            deploy/environments/production.json
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: production-frontend-${{ needs.build.outputs.source_commit }}
          path: release
      - name: Refuse a release superseded during build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` }, cache: 'no-store' });
          const main = await response.json();
          if (!response.ok || main.object?.sha !== process.env.RELEASE_COMMIT) throw new Error('A newer main commit exists. Refusing to publish this superseded release.');
          NODE
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config release/wrangler.release.json
  activate:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Connect the production hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/connect-domain.mjs deploy/environments/production.json
