name: Desktop web checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'engine/**', 'scripts/**', 'tests/**', 'package*.json', 'index.html', 'tsconfig.json', 'vite.config.ts', '.github/workflows/web-checks.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - run: npm ci --include=optional --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node --test engine/scripts/svg-conformance.test.mjs scripts/assert-engine.test.mjs
      - run: npm run engine:verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: |
          for browser in chromium firefox webkit; do
            BROWSER="$browser" npm run test:browser
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-web-evidence
          path: |
            test-results/
            package-lock.json
            dist/
          retention-days: 7

  deploy:
    name: Deploy guest preview to Cloudflare Pages
    needs: web
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the build tested in this run
        uses: actions/download-artifact@v4
        with:
          name: desktop-web-evidence
          path: verified
      - name: Validate configuration and resolve the existing production branch
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node --input-type=module <<'NODE'
          import { access, appendFile } from 'node:fs/promises';

          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account,
            CLOUDFLARE_PAGES_PROJECT: project } = process.env;
          if (!token || !/^[a-f0-9]{32}$/i.test(account ?? '') ||
              !/^[a-z0-9][a-z0-9-]*$/.test(project ?? '')) {
            throw new Error('Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_PROJECT repository variables.');
          }
          await access('verified/dist/index.html');
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`,
            { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30_000) }
          );
          if (!response.ok) {
            throw new Error(`Cloudflare Pages project lookup failed (HTTP ${response.status}). Check the account ID, exact Pages project name, and token permissions.`);
          }
          const data = await response.json();
          const branch = data.result?.production_branch;
          if (!data.success || !/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(branch ?? '')) {
            throw new Error('Cloudflare did not return a supported production branch for this Pages project.');
          }
          const command = `pages deploy verified/dist --project-name=${project} --branch=${branch} --commit-hash=${process.env.GITHUB_SHA}`;
          await appendFile(process.env.GITHUB_OUTPUT, `command=${command}\n`);
          console.log(`Deploying the tested build to Pages project ${project}, production branch ${branch}.`);
          NODE
      - name: Publish the verified build
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          packageManager: npm
          command: ${{ steps.project.outputs.command }}
