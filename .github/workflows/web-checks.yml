name: Desktop web checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'engine/**', 'scripts/**', 'tests/**', 'package*.json', 'index.html', 'tsconfig.json', 'vite.config.ts', 'wrangler.json', '.github/workflows/web-checks.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - run: npm ci --include=optional --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node --test engine/scripts/svg-conformance.test.mjs scripts/assert-engine.test.mjs
      - run: npm run engine:verify
      - run: npm run build
      - name: Validate static asset deployment without publishing
        run: npx --yes wrangler@4 deploy --config wrangler.json --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_SEND_ERROR_REPORTS: 'false'
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: |
          for browser in chromium firefox webkit; do
            BROWSER="$browser" npm run test:browser
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-web-evidence
          path: |
            test-results/
            package-lock.json
            dist/
            wrangler.json
          retention-days: 7

  deploy:
    name: Deploy guest preview to Cloudflare Workers
    needs: web
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_SEND_ERROR_REPORTS: 'false'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the build tested in this run
        uses: actions/download-artifact@v4
        with:
          name: desktop-web-evidence
          path: verified
      - name: Validate credentials and the existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { access, readFile } from 'node:fs/promises';

          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env;
          if (!token || !/^[a-f0-9]{32}$/i.test(account ?? '')) {
            throw new Error('Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID repository variable.');
          }
          await access('verified/dist/index.html');
          const config = JSON.parse(await readFile('verified/wrangler.json', 'utf8'));
          if (!/^[a-z0-9][a-z0-9-]*$/.test(config.name ?? '')) {
            throw new Error('The tested artifact does not contain a valid Worker name.');
          }
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${config.name}/settings`,
            { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30_000) }
          );
          if (!response.ok || !(await response.json()).success) {
            throw new Error(`Existing Worker lookup failed (HTTP ${response.status}). Check the account ID, Worker name, and token permissions.`);
          }
          console.log(`Deploying the tested build to existing Worker ${config.name}.`);
          NODE
      - name: Publish the verified build
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          packageManager: npm
          command: deploy --config verified/wrangler.json
