name: Desktop web checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'engine/**', 'scripts/**', 'tests/**', 'package*.json', 'index.html', 'tsconfig.json', 'vite.config.ts', '.github/workflows/web-checks.yml']
  pull_request:
permissions:
  contents: read
concurrency:
  group: desktop-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - run: npm ci --include=optional --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node --test engine/scripts/svg-conformance.test.mjs scripts/assert-engine.test.mjs
      - run: npm run engine:verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: |
          for browser in chromium firefox webkit; do
            BROWSER="$browser" npm run test:browser
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-web-evidence
          path: |
            test-results/
            package-lock.json
            dist/
          retention-days: 7
